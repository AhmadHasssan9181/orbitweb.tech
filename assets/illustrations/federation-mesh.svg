<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" fill="none" class="federation-mesh-svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="orbitBlurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#4752C4"/>
    </linearGradient>
    <linearGradient id="orbitSteelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8FC7"/>
      <stop offset="100%" stop-color="#3B71AB"/>
    </linearGradient>
    <linearGradient id="orbitDeepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4752C4"/>
      <stop offset="100%" stop-color="#3C45A5"/>
    </linearGradient>
    <linearGradient id="lineGradAB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="50%" stop-color="#5B8FC7"/>
      <stop offset="100%" stop-color="#4752C4"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Grid Pattern -->
  <g opacity="0.45">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E3E5E8" stroke-width="1"/>
    </pattern>
    <rect width="680" height="440" fill="url(#grid)"/>
  </g>

  <!-- Connecting Federation Links (Bezier curves) -->
  <!-- Link 1: Alice (orbitweb.tech) to Bob (matrix.org) -->
  <path id="pathAB" d="M 160 220 C 260 120, 420 120, 520 220" fill="none" stroke="#E3E5E8" stroke-width="2.5" stroke-dasharray="6 6"/>
  <path d="M 160 220 C 260 120, 420 120, 520 220" fill="none" stroke="url(#lineGradAB)" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Link 2: Alice to Charlie (sovereign node bottom) -->
  <path id="pathAC" d="M 160 220 C 200 340, 280 370, 340 370" fill="none" stroke="#E3E5E8" stroke-width="2.5" stroke-dasharray="6 6"/>
  <path d="M 160 220 C 200 340, 280 370, 340 370" fill="none" stroke="#5865F2" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Link 3: Bob to Charlie -->
  <path id="pathBC" d="M 520 220 C 480 340, 400 370, 340 370" fill="none" stroke="#E3E5E8" stroke-width="2.5" stroke-dasharray="6 6"/>
  <path d="M 520 220 C 480 340, 400 370, 340 370" fill="none" stroke="#5B8FC7" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Cross-mesh secondary links to satellite nodes -->
  <path d="M 160 220 L 80 120" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="80" cy="120" r="6" fill="#F2F3F5" stroke="#949BA4" stroke-width="2"/>
  <text x="80" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#5C5E66" text-anchor="middle" font-weight="600">Relay Node</text>

  <path d="M 520 220 L 600 120" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="600" cy="120" r="6" fill="#F2F3F5" stroke="#949BA4" stroke-width="2"/>
  <text x="600" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#5C5E66" text-anchor="middle" font-weight="600">Bridge Gateway</text>

  <path d="M 340 370 L 340 420" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="340" cy="420" r="5" fill="#F2F3F5" stroke="#949BA4" stroke-width="2"/>

  <!-- Animated Data Packets Traveling between homeservers -->
  <circle r="5" fill="#5865F2" filter="url(#softGlow)">
    <animateMotion dur="3.8s" repeatCount="indefinite" path="M 160 220 C 260 120, 420 120, 520 220"/>
  </circle>
  <circle r="3" fill="#FFFFFF">
    <animateMotion dur="3.8s" repeatCount="indefinite" path="M 160 220 C 260 120, 420 120, 520 220"/>
  </circle>

  <circle r="5" fill="#5B8FC7" filter="url(#softGlow)">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 520 220 C 420 120, 260 120, 160 220"/>
  </circle>

  <circle r="4" fill="#5865F2" filter="url(#softGlow)">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M 160 220 C 200 340, 280 370, 340 370"/>
  </circle>
  <circle r="4" fill="#5B8FC7" filter="url(#softGlow)">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M 340 370 C 400 370, 480 340, 520 220"/>
  </circle>

  <!-- Central Encryption Seal Badge in the center of the arc -->
  <g transform="translate(340, 125)" filter="url(#cardShadow)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#FFFFFF" stroke="#E3E5E8" stroke-width="1.5"/>
    <circle cx="-62" cy="0" r="7" fill="rgba(88, 101, 242, 0.12)"/>
    <!-- Lock Icon -->
    <path d="M -64 -2 L -64 -4 C -64 -5.5 -63 -6.5 -62 -6.5 C -61 -6.5 -60 -5.5 -60 -4 L -60 -2 M -65 -2 L -59 -2 C -58.5 -2 -58 -1.5 -58 -1 L -58 3 C -58 3.5 -58.5 4 -59 4 L -65 4 C -65.5 4 -66 3.5 -66 3 L -66 -1 C -66 -1.5 -65.5 -2 -65 -2 Z" fill="none" stroke="#5865F2" stroke-width="1.2"/>
    <text x="-48" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#060607">Matrix E2EE Federation</text>
  </g>

  <!-- Node 1: Left - orbitweb.tech (Alice) -->
  <g transform="translate(160, 220)" filter="url(#cardShadow)">
    <!-- Outer pulses -->
    <circle cx="0" cy="0" r="38" fill="#5865F2" fill-opacity="0.08"/>
    <circle cx="0" cy="0" r="28" fill="#5865F2" fill-opacity="0.16"/>
    <!-- Core server node -->
    <circle cx="0" cy="0" r="20" fill="url(#orbitBlurpleGrad)"/>
    <!-- Server Icon inside -->
    <rect x="-8" y="-7" width="16" height="5" rx="1" fill="#FFFFFF"/>
    <circle cx="-4" cy="-4.5" r="1" fill="#3C45A5"/>
    <rect x="-8" y="1" width="16" height="5" rx="1" fill="#FFFFFF"/>
    <circle cx="-4" cy="3.5" r="1" fill="#3C45A5"/>

    <!-- User & Server Card -->
    <g transform="translate(0, 48)">
      <rect x="-95" y="0" width="190" height="52" rx="12" fill="#FFFFFF" stroke="#E3E5E8" stroke-width="1.5"/>
      <circle cx="-70" cy="26" r="14" fill="#EEF2FF"/>
      <!-- User avatar letter -->
      <text x="-70" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#5865F2" text-anchor="middle">A</text>
      <text x="-46" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#060607">Alice</text>
      <text x="-46" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5865F2" font-weight="600">@alice:orbitweb.tech</text>
    </g>
  </g>

  <!-- Node 2: Right - matrix.org (Bob) -->
  <g transform="translate(520, 220)" filter="url(#cardShadow)">
    <!-- Outer pulses -->
    <circle cx="0" cy="0" r="38" fill="#5B8FC7" fill-opacity="0.08"/>
    <circle cx="0" cy="0" r="28" fill="#5B8FC7" fill-opacity="0.16"/>
    <!-- Core server node -->
    <circle cx="0" cy="0" r="20" fill="url(#orbitSteelGrad)"/>
    <!-- Server Icon inside -->
    <rect x="-8" y="-7" width="16" height="5" rx="1" fill="#FFFFFF"/>
    <circle cx="-4" cy="-4.5" r="1" fill="#2E5C8D"/>
    <rect x="-8" y="1" width="16" height="5" rx="1" fill="#FFFFFF"/>
    <circle cx="-4" cy="3.5" r="1" fill="#2E5C8D"/>

    <!-- User & Server Card -->
    <g transform="translate(0, 48)">
      <rect x="-95" y="0" width="190" height="52" rx="12" fill="#FFFFFF" stroke="#E3E5E8" stroke-width="1.5"/>
      <circle cx="-70" cy="26" r="14" fill="#F0F4F8"/>
      <!-- User avatar letter -->
      <text x="-70" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#5B8FC7" text-anchor="middle">B</text>
      <text x="-46" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#060607">Bob</text>
      <text x="-46" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5B8FC7" font-weight="600">@bob:matrix.org</text>
    </g>
  </g>

  <!-- Node 3: Bottom - Self-Hosted Sovereign Node (Charlie) -->
  <g transform="translate(340, 370)" filter="url(#cardShadow)">
    <circle cx="0" cy="0" r="28" fill="#4752C4" fill-opacity="0.10"/>
    <circle cx="0" cy="0" r="17" fill="url(#orbitDeepGrad)"/>
    <!-- Shield / Server Icon -->
    <path d="M 0 -8 L 6 -5 L 6 0 C 6 4.5 3 7.5 0 9 C -3 7.5 -6 4.5 -6 0 L -6 -5 Z" fill="#FFFFFF"/>

    <!-- Server label -->
    <g transform="translate(0, -38)">
      <rect x="-80" y="0" width="160" height="26" rx="8" fill="#FFFFFF" stroke="#E3E5E8" stroke-width="1.2"/>
      <text x="0" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#4752C4" text-anchor="middle">sovereign-vault.eu</text>
    </g>
  </g>
</svg>
